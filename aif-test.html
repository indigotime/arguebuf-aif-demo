<!DOCTYPE html>
<html>
<head>
    <title>Arguebuf Final Test - Argdown to AIF</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .container { display: flex; gap: 20px; margin: 20px 0; }
        .panel { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 15px; }
        textarea { width: 100%; height: 200px; font-family: monospace; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 15px; border-radius: 5px; overflow: auto; max-height: 400px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Argdown → AIF Converter</h1>
    <p>Using Arguebuf library compiled for browser</p>
    
    <div class="container">
        <div class="panel">
            <h3>Argdown Input</h3>
            <textarea id="argdownInput">[A]: We should use TypeScript
    + <B>: Improves code quality
    - <C>: Adds complexity

<B>: Improves code quality
    + <D>: Catches type errors early</textarea>
            <button onclick="convert()">Convert to AIF</button>
        </div>
        
        <div class="panel">
            <h3>AIF Output</h3>
            <div id="output">Click "Convert to AIF"</div>
        </div>
    </div>
    
    <div id="stats"></div>
    
    <script>
        window.process = { env: { NODE_ENV: 'production' } };
        window.require = function(m) { return {}; };
    </script>
    
	<script src="arguebuf-vite-umd.js"></script>
    
    <script>
        function convert() {
            const argdown = document.getElementById('argdownInput').value;
            const output = document.getElementById('output');
            const stats = document.getElementById('stats');
            
            output.innerHTML = '<p>Converting...</p>';
            stats.innerHTML = '';
            
            try {
                // 1. Parse Argdown
                const graph = arguebuf.load.argdown(argdown);
                
                // 2. Export to AIF
                const aif = arguebuf.dump.aif(graph);
                
                // 3. Display results
                output.innerHTML = `
                    <h4 class="success">✅ Conversion Successful!</h4>
                    <details>
                        <summary>Show AIF JSON</summary>
                        <pre>${JSON.stringify(aif, null, 2)}</pre>
                    </details>
                `;
                
                // 4. Show statistics
                stats.innerHTML = `
                    <h3>Statistics</h3>
                    <ul>
                        <li>Argdown statements: ${argdown.split('\n').filter(l => l.trim()).length}</li>
                        <li>Graph nodes: ${graph._nodes?.size || 0}</li>
                        <li>Graph edges: ${graph._edges?.size || 0}</li>
                        <li>AIF nodes: ${aif.nodes?.length || 0}</li>
                        <li>AIF edges: ${aif.edges?.length || 0}</li>
                        <li>AIF schemes: ${aif.schemes?.length || 0}</li>
                    </ul>
                `;
                
                console.log('Conversion successful:', { graph, aif });
                
            } catch (error) {
                output.innerHTML = `
                    <h4 class="error">❌ Conversion Failed</h4>
                    <p>${error.message}</p>
                    <pre>${error.stack}</pre>
                `;
                console.error('Conversion error:', error);
            }
        }
        
        setTimeout(convert, 500);
    </script>
</body>
</html>
